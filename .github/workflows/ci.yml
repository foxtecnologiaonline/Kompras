name: CI (typecheck + tests)

# Reusable: the EAS build workflow calls this as a gate before spending a cloud
# build. Also runs on pull requests and on demand. Pushes to main/claude/** are
# covered by that gate, so there is deliberately no `push` trigger here (it
# would run everything twice).
on:
  pull_request: {}
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Node >= 22.13: the DB tests use the built-in node:sqlite without flags.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app + tests)
        run: npm run typecheck

      - name: Unit tests
        run: npm test
