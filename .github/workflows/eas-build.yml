name: EAS Build (Android preview APK)

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    name: Build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (idempotent)
        run: eas init --non-interactive --force

      - name: Build Android APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Print build summary
        if: always()
        run: |
          echo "Confira o link de download do APK no painel: https://expo.dev"
          eas build:list --platform android --limit 1 --non-interactive || true
